<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Explorer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        h2 {
            text-align: center;
            color: #4CAF50;
        }
        #fileInput {
            display: block;
            margin: 20px auto;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        #jsonContainer {
            margin-top: 20px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .folder {
            font-weight: bold;
            cursor: pointer;
            color: #4CAF50;
        }
        .folder:hover {
            text-decoration: underline;
        }
        ul {
            list-style-type: none;
            padding-left: 20px;
        }
        li {
            margin: 5px 0;
        }
        li span {
            display: inline-block;
            margin-right: 5px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h2>JSON Explorer</h2>
    <input type="file" id="fileInput" accept="application/json">
    <div id="jsonContainer"></div>

    <script>
        document.getElementById('fileInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const jsonData = JSON.parse(e.target.result);
                    displayJSON(jsonData, document.getElementById('jsonContainer'));
                };
                reader.readAsText(file);
            }
        });

        function displayJSON(data, container) {
            container.innerHTML = '';
            const ul = document.createElement('ul');
            buildTree(data, ul, '');
            container.appendChild(ul);
        }

        function buildTree(data, parentElement, prefix) {
            let counter = 1;
            Object.keys(data).forEach(key => {
                const li = document.createElement('li');
                const currentPrefix = prefix ? `${prefix}.${counter}` : `${counter}`;
                if (typeof data[key] === 'object' && data[key] !== null) {
                    li.innerHTML = `<span class='folder'>📁 ${currentPrefix}. ${key}</span>`;
                    const subList = document.createElement('ul');
                    subList.classList.add('hidden');
                    buildTree(data[key], subList, currentPrefix);
                    li.appendChild(subList);
                    li.querySelector('.folder').addEventListener('click', function() {
                        subList.classList.toggle('hidden');
                    });
                } else {
                    li.innerHTML = `<span>📄</span> ${currentPrefix}. ${key}: ${data[key]}`;
                }
                parentElement.appendChild(li);
                counter++;
            });
        }
    </script>
</body>
</html>
